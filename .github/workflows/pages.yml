name: GitHub Pages

on:
  push:
    branches:
      - main
      - agent/milestone-5-community
    paths:
      - ".github/workflows/pages.yml"
      - "assets/social-preview.jpg"
      - "data/italian_locations.csv"
      - "scripts/build_pages.py"
      - "site/**"
      - "tests/pages_core.test.mjs"
      - "tests/test_pages.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and test site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test search and map logic
        run: node --test tests/pages_core.test.mjs

      - name: Test deterministic Pages build
        run: python -m unittest discover -s tests -p "test_pages.py" -v

      - name: Build GitHub Pages artifact
        run: python scripts/build_pages.py --output _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
